<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <?!= include('_shared') ?>
</head>
<body>
  <h1>บันทึกการเติมน้ำมัน</h1>
  <div id="gate" class="card"><div class="small">กำลังตรวจสอบสิทธิ์...</div></div>

  <div id="form" style="display:none;">
    <div class="card">
      <h2>1. ระบุลูกค้า</h2>
      <button onclick="scanQr()">📷 สแกน QR ลูกค้า</button>
      <div style="text-align:center; color:#9ca3af; margin:12px 0;">— หรือ —</div>
      <label>พิมพ์เบอร์มือถือ</label>
      <input id="phone" type="tel" inputmode="numeric" maxlength="10"
        placeholder="08x-xxx-xxxx" oninput="onPhoneInput()">
      <div id="memberInfo" class="small"></div>
    </div>

    <div class="card">
      <h2>2. ยอดเงิน</h2>
      <label>ยอดเงิน (บาท) *</label>
      <input id="amount" type="number" inputmode="decimal" placeholder="เช่น 500" autocomplete="off">

      <label>วิธีชำระเงิน</label>
      <select id="paymentMethod">
        <option value="cash">เงินสด (+20% bonus)</option>
        <option value="qr" selected>QR PromptPay (+30% bonus)</option>
        <option value="credit">บัตรเครดิต</option>
      </select>

      <div id="preview" class="small" style="margin-top:12px;"></div>
      <button id="submitBtn" onclick="submitTxn()">บันทึก & ให้แต้ม</button>
      <div id="msg"></div>
    </div>
  </div>

  <script>
    let staffLineUserId = '';
    let foundMember = null;

    window.addEventListener('load', async () => {
      try {
        const profile = await initLiff();
        if (!profile) return;
        staffLineUserId = profile.userId;

        try {
          await api('lookupMember', { staffLineUserId, phone: '0000000000' });
        } catch (e) {
          if (/สิทธิ์/.test(e.message)) {
            document.getElementById('gate').innerHTML =
              '<div class="err">บัญชี LINE ของคุณไม่อยู่ในรายชื่อพนักงาน</div>' +
              '<div class="small" style="margin-top:8px;">ติดต่อผู้ดูแลให้เพิ่ม line_user_id ของคุณในชีต Staff</div>';
            return;
          }
        }
        document.getElementById('gate').style.display = 'none';
        document.getElementById('form').style.display = 'block';

        document.getElementById('amount').addEventListener('input', updatePreview);
        document.getElementById('paymentMethod').addEventListener('change', updatePreview);
      } catch (e) {
        document.getElementById('gate').innerHTML = '<div class="err">' + e.message + '</div>';
      }
    });

    async function scanQr() {
      try {
        if (!liff.scanCodeV2) {
          alert('ฟังก์ชันสแกน QR ใช้ได้เฉพาะในแอป LINE เท่านั้น\nกรุณาเปิดลิงก์นี้ผ่าน Rich Menu ใน LINE');
          return;
        }
        const result = await liff.scanCodeV2();
        if (!result || !result.value) return;
        const member = await api('scanMemberQr', {
          staffLineUserId,
          payload: result.value
        });
        setMember(member);
      } catch (e) {
        document.getElementById('memberInfo').innerHTML =
          '<div class="err">' + (e.message || 'สแกนไม่สำเร็จ') + '</div>';
      }
    }

    let phoneTimer;
    function onPhoneInput() {
      clearTimeout(phoneTimer);
      const phone = document.getElementById('phone').value.trim();
      if (phone.length < 9) {
        document.getElementById('memberInfo').innerHTML = '';
        foundMember = null;
        return;
      }
      phoneTimer = setTimeout(async () => {
        try {
          const m = await api('lookupMember', { staffLineUserId, phone });
          if (m) {
            setMember(m);
          } else {
            foundMember = null;
            document.getElementById('memberInfo').innerHTML =
              '<div class="err">ไม่พบสมาชิก - ลูกค้าต้องสมัครก่อน</div>';
          }
        } catch (e) {
          document.getElementById('memberInfo').innerHTML = '<div class="err">' + e.message + '</div>';
        }
      }, 400);
    }

    function setMember(m) {
      foundMember = m;
      document.getElementById('phone').value = m.phone;
      document.getElementById('memberInfo').innerHTML =
        `<div class="ok">✅ ${escapeHtml(m.name)} | คงเหลือ ${m.points_balance} pt</div>`;
    }

    function updatePreview() {
      const amt = Number(document.getElementById('amount').value) || 0;
      const pm = document.getElementById('paymentMethod').value;
      const base = (amt / 45) * 10;
      const mult = pm === 'cash' ? 1.2 : pm === 'qr' ? 1.3 : 1.0;
      const pts = Math.floor(base * mult);
      document.getElementById('preview').innerHTML =
        amt > 0 ? `จะได้แต้ม: <b style="color:#16a34a;">+${pts} pt</b>` : '';
    }

    async function submitTxn() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        if (!foundMember) throw new Error('กรุณาสแกน QR หรือพิมพ์เบอร์ลูกค้าก่อน');
        const amount = Number(document.getElementById('amount').value);
        if (!amount || amount <= 0) throw new Error('กรุณากรอกยอดเงิน');

        const result = await api('recordTransaction', {
          staffLineUserId,
          memberId: foundMember.member_id,
          amount: amount,
          paymentMethod: document.getElementById('paymentMethod').value
        });
        document.getElementById('msg').innerHTML =
          `<div class="ok">✅ บันทึกแล้ว +${result.points} pt | คงเหลือ ${result.newBalance} pt</div>`;
        setTimeout(() => location.reload(), 1500);
      } catch (e) {
        document.getElementById('msg').innerHTML = '<div class="err">' + e.message + '</div>';
        btn.disabled = false;
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
