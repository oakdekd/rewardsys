<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <?!= include('_shared') ?>
</head>
<body>
  <h1>สมัครสมาชิก</h1>
  <div class="card">
    <p class="small">สมัครครั้งเดียว สะสมแต้มได้ตลอด รับฟรี <b style="color:#16a34a;">+50 pt</b> ทันทีที่สมัคร</p>

    <label>ชื่อ *</label>
    <input id="name" placeholder="ชื่อสำหรับติดต่อ">

    <label>เบอร์มือถือ *</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="0812345678" maxlength="10">

    <button id="submitBtn" onclick="submitForm()">สมัครสมาชิก</button>
    <div id="msg"></div>

    <p class="small" style="margin-top:16px; line-height:1.5;">
      การกดสมัครสมาชิกถือเป็นการยินยอมให้เราเก็บข้อมูลของท่าน
      (ชื่อ เบอร์โทร ประวัติการเติมน้ำมัน) เพื่อให้บริการสะสมแต้ม
      และส่งข่าวสาร/โปรโมชั่นผ่าน LINE สามารถยกเลิกได้ตลอดเวลา
    </p>
  </div>

  <script>
    let lineUserId = '';
    let displayName = '';

    window.addEventListener('load', async () => {
      try {
        const profile = await initLiff();
        if (!profile) return;
        lineUserId = profile.userId;
        displayName = profile.displayName;
        document.getElementById('name').value = displayName;

        const existing = await api('getMember', { lineUserId: lineUserId });
        if (existing && existing.member) {
          location.href = SCRIPT_URL + '?p=member';
        }
      } catch (e) {
        showErr(e.message);
      }
    });

    async function submitForm() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        const payload = {
          lineUserId: lineUserId,
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          consentMarketing: true
        };
        await api('register', payload);
        location.href = SCRIPT_URL + '?p=member';
      } catch (e) {
        showErr(e.message);
        btn.disabled = false;
      }
    }

    function showErr(text) {
      document.getElementById('msg').innerHTML = '<div class="err">' + text + '</div>';
    }
  </script>
</body>
</html>
