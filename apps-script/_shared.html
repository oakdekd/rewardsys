<!-- Shared CSS + helpers. Include with <?!= include('_shared') ?> -->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Sukhumvit Set', 'Noto Sans Thai', sans-serif;
    margin: 0; padding: 16px; background: #f5f7fa; color: #1f2937;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 16px 0 8px; color: #374151; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .label { font-size: 12px; color: #6b7280; }
  .value { font-size: 16px; font-weight: 600; }
  .points { font-size: 36px; font-weight: 700; color: #16a34a; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  input, select, textarea {
    width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 16px; background: #fff;
  }
  label { display: block; font-size: 13px; color: #4b5563; margin: 12px 0 4px; }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 8px;
    background: #16a34a; color: #fff; font-size: 16px; font-weight: 600;
    margin-top: 16px; cursor: pointer;
  }
  button.secondary { background: #6b7280; }
  button.danger { background: #dc2626; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .small { font-size: 12px; color: #6b7280; }
  .err { color: #dc2626; font-size: 14px; margin-top: 8px; }
  .ok { color: #16a34a; font-size: 14px; margin-top: 8px; }
  .pill { display: inline-block; padding: 2px 8px; background: #e5e7eb; border-radius: 999px; font-size: 12px; }
  .reward { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
  .reward:last-child { border-bottom: 0; }
  .coupon { font-family: monospace; font-size: 24px; font-weight: 700; letter-spacing: 2px; padding: 16px; background: #fef3c7; border-radius: 8px; text-align: center; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin: 12px 0; }
  .checkbox-row input { width: auto; margin-top: 4px; }
</style>
<script>
  const SCRIPT_URL = "<?= scriptUrl ?>";
  const LIFF_ID = "<?= liffId ?>";

  async function api(action, payload) {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(Object.assign({ action: action }, payload || {}))
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'unknown error');
    return data.data;
  }

  async function initLiff() {
    if (!window.liff) throw new Error('LIFF SDK ยังไม่โหลด');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return null;
    }
    return await liff.getProfile();
  }
</script>
